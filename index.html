<style>

#shade{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.4s;background:radial-gradient(ellipse at 50% 62%,rgba(90,30,140,.4),rgba(20,6,50,.88))}

@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(255,255,255,.95))}}
#back{position:fixed;z-index:8;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;padding:0;font-size:20px;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .55s cubic-bezier(.34,1.8,.5,1)}
body.cake #back{opacity:1;pointer-events:auto}
</style></head><body>
<div id="shade"></div><canvas id="gl"></canvas><div id="heartScene"></div>
<h1 id="title"><span style="--i:0;--c:#ff6fb5">生</span><span style="--i:1;--c:#ffb347">日</span><span style="--i:2;--c:#b57bff">快</span><span style="--i:3;--c:#4fd1ff">乐</span></h1>

<button class="g cap" id="bCandle" style="--i:1">🕯 蜡烛</button>

</div>

<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hsl=(h,s,l)=>{h=(h%360+360)%360;const f=n=>{const k=(n+h/30)%12;return l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)]};
const h2c=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
const cv=$('#gl'),gl=cv.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:true});
if(!gl){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:40% 0 0;text-align:center;z-index:9">当前浏览器不支持 WebGL</p>');throw 0}
/* ---------- 着色器 ---------- */
const VS=`attribute vec3 p,n,c,s,z;uniform float uRY,uRX,uT,uAsm,uPS,uD;uniform vec2 uSc,uOff;uniform vec3 uCen;varying vec3 vC,vN;varying float vS;
vec3 rot(vec3 q){float cy=cos(uRY),sy=sin(uRY);q=vec3(cy*q.x+sy*q.z,q.y,-sy*q.x+cy*q.z);float cx=cos(uRX),sx=sin(uRX);return vec3(q.x,cx*q.y-sx*q.z,sx*q.y+cx*q.z);}
void main(){float t=clamp(uAsm*1.8-z.y*.8,0.,1.);t=t*t*(3.-2.*t);vec3 q=rot(mix(s,p,t)-uCen);vec3 nn=rot(n);float f=uD/(uD-q.z);
float tw=step(.9,z.y);gl_Position=vec4(q.xy*f*uSc+uOff,-q.z*.08,1.);gl_PointSize=min(z.x*uPS*f*(.6+.4*t)*(1.+.35*tw*sin(uT*3.+z.y*60.)),140.);
vC=c;vN=nn;vS=z.z*(1.+tw*.9*(.5+.5*sin(uT*4.+z.y*90.)));}`;
const FS=`precision mediump float;varying vec3 vC,vN;varying float vS;uniform float uSoft,uHue,uFl;
vec3 hue(vec3 c,float a){const vec3 k=vec3(.57735);float ca=cos(a);return c*ca+cross(k,c)*sin(a)+k*dot(k,c)*(1.-ca);}
void main(){vec2 d=gl_PointCoord-.5;float r=length(d);
if(uSoft>.5){float a=exp(-r*r*16.)*step(r,.5);gl_FragColor=vec4(vC*a,a);return;}
if(r>.5)discard;vec3 c=hue(vC,uHue);
if(dot(vN,vN)>.01){vec3 N=normalize(vN),L=normalize(vec3(-.45,.75,.55)),H=normalize(L+vec3(0.,0.,1.));float nd=max(dot(N,L),0.);
vec3 amb=mix(vec3(.30,.22,.42),vec3(.62,.48,.55),N.y*.5+.5);float sp=pow(max(dot(N,H),0.),40.)*vS;float rim=pow(1.-max(N.z,0.),3.);
c=c*(amb+vec3(1.,.93,.88)*nd*.95)+sp*vec3(1.,.95,.9)+rim*vec3(.8,.4,1.)*.22+uFl*vec3(1.,.6,.25)*max(N.y*.6+.4,0.)*.2;}
gl_FragColor=vec4(c,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pg=gl.createProgram();gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);gl.useProgram(pg);
const AL=['p','n','c','s','z'].map(n=>gl.getAttribLocation(pg,n)),UL={},u=(n,...v)=>gl['uniform'+v.length+'f']((UL[n]??=gl.getUniformLocation(pg,n)),...v);
const bind=b=>{gl.bindBuffer(gl.ARRAY_BUFFER,b);AL.forEach((l,i)=>{gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,3,gl.FLOAT,false,60,i*12)})};
const SB=gl.createBuffer(),DB=gl.createBuffer(),MAXD=7000,DA=new Float32Array(MAXD*15);let NS=0,nd=0;
gl.bindBuffer(gl.ARRAY_BUFFER,DB);gl.bufferData(gl.ARRAY_BUFFER,DA.byteLength,gl.DYNAMIC_DRAW);
/* ---------- 蛋糕点云 ---------- */
const TH=[{n:'玫瑰莓果',t:['#ffb3c8','#ffd0dd','#ffc2d1'],f:'#fff5f8',d:'#ff5c8a',p:'#ffffff',fr:['#ff2d55','#c1124b','#ff7a9c']},
{n:'午夜巧克力',t:['#4a2a1e','#5c3626','#3b2017'],f:'#9a6a46',d:'#2b140d',p:'#ffcf70',fr:['#d00020','#ff4d6d','#ffd166']},
{n:'极光幻境',t:['#6c63ff','#8a7dff','#5ad1ff'],f:'#e8e4ff',d:'#00e5c3',p:'#ffffff',fr:['#ff7ad9','#7affd8','#fff27a']},
{n:'抹茶森林',t:['#8fc46a','#b6dc92','#9ccf7b'],f:'#fffcec',d:'#5a9a3a',p:'#ffffff',fr:['#ff5d73','#ffd166','#ffffff']},
{n:'香槟金奢',t:['#ffe3a1','#fff0c4','#ffd98a'],f:'#fffaf0',d:'#d99a2b',p:'#fff3c9',fr:['#ff4d6d','#ffb703','#ffffff']}];
let th=0,cn=7,CD=[];
function build(){const T_=TH[th],A=[],tier=T_.t.map(h2c),fr=h2c(T_.f),dr=h2c(T_.d),pe=h2c(T_.p),fru=T_.fr.map(h2c),gold=[1,.8,.42];
const add=(x,y,z,nx,ny,nz,c,sz=.016,sh=.3)=>{const j=1+rnd(-.07,.07);A.push(x,y,z,nx,ny,nz,c[0]*j,c[1]*j,c[2]*j,rnd(-4,4),rnd(-2,5),rnd(-4,4),sz*rnd(.85,1.2),Math.random(),sh)};
for(let k=0;k<4500;k++){const r=1.62*Math.sqrt(Math.random()),a=rnd(6.283),b=.72+.28*Math.sin(r*50);add(r*Math.cos(a),0,r*Math.sin(a),0,1,0,[.95*b,.9*b,.86*b],.018,.7)}
for(let k=0;k<600;k++){const a=rnd(6.283);add(1.62*Math.cos(a),rnd(-.07,0),1.62*Math.sin(a),Math.cos(a),0,Math.sin(a),gold,.016,1)}
const RS=[1,.72,.46,0],HH=.44;
const fruit=(cx,cy,cz,rd,c)=>{for(let k=0;k<75;k++){let x=rnd(-1,1),y=rnd(-1,1),z=rnd(-1,1);const l=Math.hypot(x,y,z)||1;x/=l;y/=l;z/=l;add(cx+x*rd,cy+y*rd,cz+z*rd,x,y,z,c,.013,1.6)}};
const pearls=(r,y,m,pr)=>{for(let i=0;i<m;i++){const a=i/m*6.283,cx=r*Math.cos(a),cz=r*Math.sin(a);for(let k=0;k<16;k++){let x=rnd(-1,1),y2=rnd(-1,1),z=rnd(-1,1);const l=Math.hypot(x,y2,z)||1;x/=l;y2/=l;z/=l;add(cx+x*pr,y+y2*pr,cz+z*pr,x,y2,z,pe,.012,1.5)}}};
for(let i=0;i<3;i++){const r=RS[i],y0=i*HH,a0=RS[i+1];
for(let k=0;k<11000*r;k++){const th_=rnd(6.283),u=Math.random(),y=y0+u*HH,w=th_+.07*Math.sin(th_*26+i),nx=Math.cos(w),nz=Math.sin(w),rr=r+.012*Math.sin(th_*26+i),dl=HH*(.16+.3*Math.max(0,Math.sin(th_*7+i*2)*Math.sin(th_*13+1)));
let c,sh=.35,sz=.016;if(u>.955){c=fr;sh=.7}else if(y>y0+HH-dl){c=dr;sh=.95}else{c=tier[i].map(v=>v*(.82+.18*u))}
if(Math.random()<.02){c=gold;sh=1.4;sz=.02}add(rr*nx,y,rr*nz,nx,0,nz,c,sz,sh)}
for(let k=0;k<4500*(r*r-a0*a0);k++){const rr=Math.sqrt(a0*a0+(r*r-a0*a0)*Math.random()),a=rnd(6.283),b=.9+.1*Math.sin(rr*70);add(rr*Math.cos(a),y0+HH,rr*Math.sin(a),0,1,0,fr.map(v=>v*b),.016,.6)}
pearls(r-.05,y0+HH+.03,Math.round(44*r),.034)}
pearls(1.03,.03,44,.034);
for(let i=0;i<12;i++){const a=i/12*6.283;fruit(.86*Math.cos(a),.44+.07,.86*Math.sin(a),.075,fru[i%3])}
for(let i=0;i<8;i++){const a=i/8*6.283+.2;fruit(.59*Math.cos(a),.88+.06,.59*Math.sin(a),.06,fru[(i+1)%3])}
for(let i=0;i<6;i++){const a=i/6*6.283+.5;fruit(.38*Math.cos(a),1.32+.045,.38*Math.sin(a),.045,fru[i%3])}
for(let k=0;k<700;k++){const u=k/700,a=u*18*Math.PI,rr=.14*(1-u)+.01,y=1.32+.02+.09*u;add(rr*Math.cos(a),y,rr*Math.sin(a),Math.cos(a)*.6,.8,Math.sin(a)*.6,fr,.012,.8)}
CD=[];for(let i=0;i<cn;i++){const a=i/cn*6.283,rd=cn===1?0:.27,x=rd*Math.cos(a),z=rd*Math.sin(a),hc=hsl(rnd(360),.8,.72);CD.push({x,y:1.58,z,lit:!blown,rb:false,a:0});
for(let k=0;k<70;k++){const u=Math.random(),an=rnd(6.283);add(x+.017*Math.cos(an),1.32+u*.26,z+.017*Math.sin(an),Math.cos(an),0,Math.sin(an),Math.floor(u*8)%2?[1,1,1]:hc,.011,.8)}}
gl.bindBuffer(gl.ARRAY_BUFFER,SB);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(A),gl.STATIC_DRAW);NS=A.length/15}
/* ---------- 动态粒子（火焰/烟花/文字） ---------- */
const D=[];let W,H,ps,cy,dpr,T=0,ry=.6,rx=.42,asm=0,asmDir=.4,drag=false,blown=false,hueOn=false,found=new Set();
const spawn=o=>{if(D.length<MAXD-300)D.push(Object.assign({x:0,y:0,z:0,vx:0,vy:0,vz:0,g:0,drag:0,life:0,max:1,size:.04,c:[1,1,1],fs:0,pw:1,sd:Math.random()},o))};
function put(x,y,z,c,sz,sd){if(nd>=MAXD)return;const i=nd++*15;DA[i]=x;DA[i+1]=y;DA[i+2]=z;DA[i+3]=DA[i+4]=DA[i+5]=0;DA[i+6]=c[0];DA[i+7]=c[1];DA[i+8]=c[2];DA[i+12]=sz;DA[i+13]=sd;DA[i+14]=0}
function tv(x,y,z,a){y-=.95;const X=Math.cos(a)*x+Math.sin(a)*z,Z=-Math.sin(a)*x+Math.cos(a)*z,c=Math.cos(rx),s=Math.sin(rx);return[X,c*y-s*Z,s*y+c*Z]}
const scr=(X,Y,Z)=>{const f=7/(7-Z);return[W/2+X*f*ps,cy-Y*f*ps]};
function boom(x,y,z=rnd(-1,.5),k=Math.random()*3|0){const h=rnd(360),n=k===1?130:150,sp=rnd(1.2,1.8);
for(let i=0;i<n;i++){let vx,vy,vz,a=rnd(6.283);
if(k===1){const t=i/n*6.283;vx=Math.sin(t)**3;vy=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16;vz=rnd(-.1,.1)}
else if(k===2){vx=Math.cos(a);vy=Math.sin(a)*.3;vz=Math.sin(a)}
else{const q=rnd(-1,1),s=Math.sqrt(1-q*q);vx=s*Math.cos(a);vy=q;vz=s*Math.sin(a)}
const m=k===0?rnd(.5,1):1;spawn({x,y,z,vx:vx*sp*m,vy:vy*sp*m,vz:vz*sp*m,g:-.7,drag:1.5,max:rnd(1.4,2.2),size:.05,c:hsl(h+rnd(-25,25),1,.62),pw:.8})}}
function rocket(tx,ty){const x0=tx+rnd(-.3,.3),yb=(cy-H)/ps-.2;spawn({x:x0,y:yb,z:rnd(-1,0),vy:(ty-yb)/.7,max:.7,size:.04,c:[1,.85,.5],trail:1,boom:p=>boom(p.x,p.y,p.z)})}
function text(s,fsz=110){const c=document.createElement('canvas');c.width=760;c.height=200;const x=c.getContext('2d');x.font=`900 ${fsz}px "PingFang SC",Arial,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(s,380,100,740);
const d=x.getImageData(0,0,760,200).data,k=Math.min(3.4,W/ps*.92)/760,y=(cy-H*.3)/ps;
for(let py=0;py<200;py+=5)for(let px=0;px<760;px+=5)if(d[(py*760+px)*4+3]>128)spawn({x:rnd(-.3,.3),y:.5,tx:(px-380)*k,ty:y-(py-100)*k,fs:4.2,max:5.8,size:.034,c:hsl(px/760*320+20,.9,.68),vx:rnd(-2,2),vy:rnd(1,3),vz:rnd(-1,1)})}

let AC,MG,nextT=0,musicOn=false,justStarted=false;const mu=$('#mu');
function note(f,t,d,v){[[f,v],[f*2,v*.25]].forEach(([q,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=q;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)})}

const cvb=AC.createConvolver(),wet=AC.createGain();cvb.buffer=ib;wet.gain.value=.55;MG.connect(wet);wet.connect(cvb);cvb.connect(AC.destination);sched();setInterval(()=>{if(AC.state==='running'&&nextT-AC.currentTime<2)sched()},400)}

function size(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;const fs=cl(W*.12,44,104),top=H*.04+fs*1.25+46;ps=cl(Math.min(W*.88/3.3,(H-96-top)/3.1),70,430);cy=(top+H-96)/2;layout(top)}

for(let i=D.length-1;i>=0;i--){const p=D[i];p.life+=dt;if(p.life>=p.max){p.boom&&p.boom(p);D[i]=D[D.length-1];D.pop();continue}
